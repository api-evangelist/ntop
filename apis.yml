aid: ntop
name: nTop
description: >-
  nTop (formerly nTopology) is computational design and engineering software for
  advanced and additive manufacturing. Its field-driven, implicit modeling
  engine lets engineers build reusable, logic-driven design workflows and
  systematically explore hundreds of design variants with manufacturing
  constraints, performance requirements, and simulation built in — spanning
  lattices, conformal structures, design-for-additive-manufacturing, and
  topology-informed optimization across aerospace, automotive, medical, and
  industrial applications. Beyond the desktop application, nTop exposes a
  developer surface: the nTop Core SDK (a native Windows DLL with C++, .NET, and
  Python bindings for querying implicit bodies), nTop Automate for headless
  workflow automation, extensive Mintlify-hosted documentation, and a public
  documentation MCP server for agent-based retrieval.
